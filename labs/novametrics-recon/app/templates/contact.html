{% extends "base.html" %}
{% block title %}Contact — NovaMetrics{% endblock %}
{% block content %}
<main>
  <div class="section-title">Contact us</div>
  <div class="section-sub">We typically respond within one business day.</div>
  <div class="contact-card">
    <form>
      <div class="field"><label>Name</label><input type="text" /></div>
      <div class="field"><label>Email</label><input type="email" /></div>
      <div class="field"><label>Message</label><textarea rows="4"></textarea></div>
      <button class="btn" type="button">Send</button>
    </form>
  </div>
</main>
{% endblock %}
