<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password • PixelGram</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-wrap">
      <h1 style="text-align:center; font-weight:600; font-size:20px; margin-bottom:24px;">Reset your password</h1>
      <div class="card">
        {% if submitted %}
        <p class="muted" style="text-align:center; margin:0;">
          If an account matching that username exists, we've sent recovery instructions to the email on file.
        </p>
        {% else %}
        <form method="POST" action="/forgot-password" class="field">
          <input class="text-input" name="username" placeholder="Username" />
          <button type="submit" class="btn btn-primary">Send recovery instructions</button>
        </form>
        {% endif %}
      </div>
      <div style="text-align:center; margin-top:14px;">
        <a href="/login" class="muted-link">Back to login</a>
      </div>
    </div>
  </div>
</body>
</html>
